name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build addon zip
        run: |
          mkdir -p dist/ForeverBuffs
          cp ForeverBuffs.toc *.lua README.md dist/ForeverBuffs/
          cd dist && zip -r "ForeverBuffs-${GITHUB_REF_NAME}.zip" ForeverBuffs
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ForeverBuffs-${{ github.ref_name }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
